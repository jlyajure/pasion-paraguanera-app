<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasión Paraguanera</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#121212">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- VISTA DEL CLIENTE (Pública) -->
    <div id="vista-cliente" class="container">
        <img src="logo.png" alt="Logo Pasión Paraguanera" id="titulo-secreto" class="logo-tienda">
        
        <p>Catálogo Oficial</p>
        
        <!-- VITRINA PÚBLICA DE PRODUCTOS -->
        <div id="catalogo-publico" class="catalogo-grid">
            <!-- Los productos de Firestore aparecerán aquí automáticamente -->
        </div>
    </div>

    <!-- MODAL DE LOGIN OCULTO -->
    <div id="modal-login" class="modal oculto">
        <div class="modal-contenido">
            <h2>Acceso Propietario</h2>
            <input type="email" id="email-admin" placeholder="Correo de administrador">
            <input type="password" id="pass-admin" placeholder="Contraseña">
            
            <div class="mostrar-pass-container">
                <input type="checkbox" id="chk-mostrar-pass">
                <label for="chk-mostrar-pass">Mostrar contraseña</label>
            </div>

            <button id="btn-entrar">Entrar al Sistema</button>
            <button id="btn-cerrar-modal" class="btn-secundario">Cancelar</button>
            <p id="mensaje-error" class="error oculto">Datos incorrectos. Intenta de nuevo.</p>
        </div>
    </div>

    <!-- VISTA DEL ADMINISTRADOR (Privada) -->
    <div id="vista-admin" class="container oculto">
        <h1 class="admin-titulo">Panel de Control</h1>
        <p>Gestión interna de Pasión Paraguanera.</p>
        
        <div class="admin-grid">
            <button id="btn-inventario" class="btn-modulo">📦 Control de Inventario</button>
            <button class="btn-modulo">👥 Gestión de Clientes</button>
            <button class="btn-modulo">📄 Facturación y Pedidos</button>
        </div>
        
        <button id="btn-salir" class="btn-secundario mt-20">Cerrar Sesión</button>
    </div>

    <!-- MÓDULO DE INVENTARIO -->
    <div id="modulo-inventario" class="container oculto">
        <button id="btn-volver-admin" class="btn-secundario btn-pequeno">⬅ Volver al Panel</button>
        <h2 class="admin-titulo">📦 Inventario</h2>
        
        <!-- Formulario aligerado -->
        <form id="form-producto" class="form-inventario">
            <input type="text" id="prod-nombre" placeholder="Nombre del Producto" required>
            <textarea id="prod-desc" placeholder="Descripción breve" rows="2" required></textarea>
            
            <div class="fila-inputs">
                <input type="number" id="prod-precio" placeholder="Precio ($)" step="0.01" required>
                <input type="number" id="prod-stock" placeholder="Stock (Ej: 0)" value="0" required>
            </div>
            
            <!-- NUEVO: Solo pega el enlace directo de la imagen -->
            <input type="url" id="prod-foto" placeholder="Pega aquí el enlace de la imagen" required>
            
            <button type="submit" id="btn-guardar-prod">Guardar Producto</button>
        </form>

        <h3 class="subtitulo">Productos Registrados</h3>
        <div id="lista-productos" class="lista-productos">
            <!-- Aquí irán apareciendo los productos del administrador -->
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
